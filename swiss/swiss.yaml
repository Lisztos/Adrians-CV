design:
  theme: swiss
  page:
    size: a4
    show_top_note: false
    show_footer: false
  typography:
    alignment: left
    font_family:
      body: Lato
      name: Lato
      headline: Lato
      connections: Lato
      section_titles: Lato
  header:
    connections:
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: "·"
  sections:
    show_time_spans_in: []
  templates:
    education_entry:
      main_column: "**INSTITUTION**, DEGREE_WITH_AREA -- LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
      degree_column: null
    normal_entry:
      main_column: "**NAME** -- **LOCATION**\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
    experience_entry:
      main_column: "**POSITION**, COMPANY -- LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
